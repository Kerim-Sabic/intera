name: Desktop checks and beta artifacts
on: [push, pull_request, workflow_dispatch]
concurrency:
  group: desktop-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Verify camera model boundary without camera or ML dependencies
        run: python -m unittest discover -s camera -p test_worker.py
      - name: Compile native camera extension and main-process bridge
        if: runner.os == 'macOS'
        run: npm run camera:native
      - name: Retain native camera compile evidence
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Intera-camera-native-${{ matrix.arch }}
          path: out/camera-native/
      - run: npm run make -- --arch=${{ matrix.arch }}
      - name: Exercise packaged Mac app and desktop UI
        if: runner.os == 'macOS'
        env:
          INTERA_MAC_EXECUTABLE: out/Intera AI-darwin-${{ matrix.arch }}/Intera AI.app/Contents/MacOS/Intera
        run: npx playwright test
      - name: Attempt packaged Mac local-only playback diagnostic
        if: runner.os == 'macOS'
        continue-on-error: true
        env:
          INTERA_CAPTURE_EXECUTABLE: out/Intera AI-darwin-${{ matrix.arch }}/Intera AI.app/Contents/MacOS/Intera
        run: npx tsx scripts/capture-diagnostic.ts --packaged
      # Playwright clears test-results at startup. Write integrity evidence after it.
      - name: Verify Mac app and installer integrity
        if: runner.os == 'macOS'
        run: node scripts/verify-mac.mjs out
      - name: Attempt documented compatibility playback path
        if: runner.os == 'macOS'
        continue-on-error: true
        env:
          INTERA_CAPTURE_EXECUTABLE: out/Intera AI-darwin-${{ matrix.arch }}/Intera AI.app/Contents/MacOS/Intera
        run: npx tsx scripts/capture-diagnostic.ts --packaged --mac-playback-compat
      # One-off comparison with the actual artifact reported as damaged.
      - uses: actions/download-artifact@v4
        if: runner.os == 'macOS' && github.ref == 'refs/heads/codex/macos-reliability'
        with:
          name: Intera-unsigned-${{ matrix.os }}-${{ matrix.arch }}
          run-id: 36706713428
          github-token: ${{ github.token }}
          path: baseline-mac
      - name: Inspect original Mac artifacts without treating failure as success
        if: runner.os == 'macOS' && github.ref == 'refs/heads/codex/macos-reliability'
        run: node scripts/verify-mac.mjs baseline-mac --inspect-only
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'macOS'
        with:
          name: Intera-mac-evidence-${{ matrix.arch }}
          path: test-results/**
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: Intera-beta-${{ matrix.os }}-${{ matrix.arch }}
          path: out/make/**
          if-no-files-found: error
  # Mac beta artifacts have an ad-hoc integrity signature, not Developer ID trust.
  # Capture evidence reports limitations; CI is not physical meeting certification.
