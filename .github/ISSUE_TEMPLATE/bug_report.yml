name: Bug report
description: Help us reproduce a desktop problem without sharing private audio or text.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Use synthetic content. Do not include keys, recordings, transcripts, patient details, or payment information."
  - type: input
    id: version
    attributes:
      label: Intera version
      description: Find this in About Intera.
      placeholder: "0.2.0-beta.3"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows 11 x64
        - macOS 14.2+ Apple Silicon
        - macOS 14.2+ Intel
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: State whether this was Demo, the local playback test, or an authorized live session.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This report contains no keys, payment details, private recordings, or real conversation text.
          required: true
